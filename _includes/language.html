{% assign languages = site.data.data.languages %}
{% if languages %}
<section class="languages-container container-block">
  <h2 class="container-block-title">{{ languages.title | escape }}</h2>
  <ul class="list-unstyled interests-list">
    {% for language in languages.info %}
    <li>
      {{ language.idiom | escape }}
      <span class="lang-desc">({{ language.level | escape }})</span>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
