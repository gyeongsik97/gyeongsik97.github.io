{% assign military = site.data.data.military %}
{% if military %}
<div class="education-container container-block">
  <h2 class="container-block-title">
    {{ military.title }}
  </h2>
  <div class="item">
    <h3 class="degree">{{ military.branch }} {{ military.rank }}</h3>
    <p class="meta">{{ military.discharge }}</p>
    <div class="time">{{ military.time }}</div>
  </div>
</div>
{% endif %}
