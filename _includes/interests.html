{% assign interests = site.data.data.interests %}
{% if interests %}
<section class="interests-container container-block">
  <h2 class="container-block-title">{{ interests.title | escape }}</h2>
  <ul class="list-unstyled interests-list">
    {% for interest in interests.info %}
    <li>{{ interest.item | escape }}</li>
    {% endfor %}
  </ul>
</section>
{% endif %}
