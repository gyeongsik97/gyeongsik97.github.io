{% assign skills = site.data.data.skills %}
{% if skills %}
<section class="skills-section section" id="skills">
  <h2 class="section-title">{{ skills.title | escape }}</h2>
  <div class="skillset">
    {% for skill in skills.toolset %}
    <div class="item">
      <h3 class="skill-category">{{ skill.category | escape }}</h3>
      <p class="skill-items">{{ skill.items | escape }}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endif %}
