<!DOCTYPE html>
<html lang="ko">
{% include head.html %}
<body class="print-page">
  <div class="print-controls">
    <button type="button" id="print-document" disabled>인쇄 / PDF 저장</button>
    <p id="print-status" role="status">출력 페이지를 준비하고 있습니다.</p>
  </div>
  <main id="print-source" class="main-wrapper">{{ content }}</main>
  <div id="print-pages" aria-label="출력 문서"></div>
  <noscript>페이지 구성을 위해 JavaScript를 허용해 주세요.</noscript>
  <script src="{{ '/assets/js/print.js' | relative_url }}?v={{ asset_version }}" defer></script>
</body>
</html>
