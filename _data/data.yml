career-profile:
  title: 소개
  summary: |
    Go를 주력으로 Kubernetes 및 OpenStack 기반 제품의 백엔드 개발을 담당해 왔습니다. DR 솔루션과 HCI 제품의 복제 작업 관리, 가상화·스토리지·고가용성 및 네트워크 기능 개발과 운영 안정성 개선을 주요 업무로 수행해 왔습니다.

    사용자의 요구를 정확히 파악하는 것을 최우선으로 합니다. 기존 구현에 얽매이지 않고, 개선이 필요한 부분을 발견하면 더 나은 구조와 구현 방식을 검토하고 적용해 왔습니다. 궁극적으로는 사용자의 요구를 안정적이고 확장 가능한 구조로 구현할 수 있는 개발자로 성장하고자 합니다.
