projects:
  title: 주요 업무 및 프로젝트
  groups:
  - name: POPCON HCI 개발 및 안정화
    meta: (주)파이오링크 · 2025.07 - 현재
    summary: >
      OpenStack 기반 가상화·스토리지·고가용성 및 네트워크 기능 개발 및 안정성 개선
    assignments:
    - title: OpenStack 클러스터 간 VM 이관
      details:
      - Ceph RBD 스토리지를 사용하는 인스턴스의 클러스터 간 VM 이관 기능 개발

    - title: Cinder Local Attachment 및 다중 스토리지 지원
      details:
      - Cinder 볼륨을 지정 호스트의 블록 장치로 연결하는 관리자 API 및 에이전트 개발
      - VMware·P2V 이관 대상을 RBD·Shared LUN·RDM으로 확장

    - title: OpenStack HA 복구 안정화
      details:
      - Masakari·Nova·Cinder 장애 복구 경로의 고정 대기 및 RPC 라우팅 개선
      - 메시지 큐 충돌 문제 해결
      - 호스트 장애 검증에서 VM 통신 단절 1분 이내 확인

    - title: 시스템 업데이트 시 네트워크 연속성 개선
      details:
      - OVS 재시작 복구와 Neutron L3·DHCP agent의 데이터 플레인 보존 개선
      - 시스템 업데이트 과정의 패킷 단절 최소화

    - title: Dell Avamar 백업 연동
      details:
      - 인스턴스 단위 백업·복원 및 파일 단위 복원 기능 연동
      - 기존 Dell Avamar 제품 버그 수정
      - 배포 및 기능 사용 가이드 제공

  - name: DR 솔루션 및 VMware 마이그레이션 백엔드 개발
    meta: (주)데이타커맨드 · 2023.01 - 2025.06
    summary: >
      Kubernetes·OpenStack DR 솔루션과 VMware VM 마이그레이션 기능 개발 및 안정성 개선
    assignments:
    - title: VMware VM 증분 마이그레이션
      details:
      - CBT 기반 증분 복제 엔진 개발
      - QoS·체크포인트 재개·작업 스케줄링 구현

    - title: Kubernetes DR 솔루션
      details:
      - Kubernetes Operator 기반 복제 작업 관리 모듈 개발

    - title: OpenStack DR 솔루션
      details:
      - 데몬 기반 복제 작업 관리 모듈 개발

